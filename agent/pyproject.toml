[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["daggorath_agent"]

[project]
name = "daggorath-agent"
version = "0.1.0"
dependencies = [
    "daggorath-gym>=0.1.0",
    "stable-baselines3>=2.0",
    "torch>=2.0",
    "sb3-contrib>=2.0",
]
